name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-listing:
    name: リスティングのビルド
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: リスティングのビルド
        run: npx vpm-listing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
